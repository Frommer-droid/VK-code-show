[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
  ".venv",
  "__pycache__",
  "build",
  "dist",
  "VK-code-show",
  "_release_work",
  "Build_Tools/build",
  "Build_Tools/dist",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
